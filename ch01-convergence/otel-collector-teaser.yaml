# OpenTelemetry Collector config: dual routing for
# real-time observability AND ML training data
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert
  batch:
    send_batch_size: 8192
    timeout: 5s

exporters:
  # Real-time observability path
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # ML training data path: the contrib awss3 exporter writes
  # telemetry to an S3 bucket for offline feature engineering
  awss3:
    s3uploader:
      region: us-east-1
      s3_bucket: telemetry-lake
      s3_prefix: otel
      s3_partition_format: '%Y/%m/%d/%H'
    marshaler: otlp_proto

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheusremotewrite, awss3]
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/tempo, awss3]
