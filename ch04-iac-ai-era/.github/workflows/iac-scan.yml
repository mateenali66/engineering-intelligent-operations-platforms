# GitHub Actions only executes workflow files located at the repository root
# (.github/workflows/). Workflow files in subdirectory .github/workflows/
# paths are ignored by the Actions runner. Because this companion repo has a
# single root, subdirectory workflows are dead files.
#
# The IaC scan logic from the original draft of this file has been moved into
# the root workflow at companion-repo/.github/workflows/ci.yml, split across
# two jobs:
