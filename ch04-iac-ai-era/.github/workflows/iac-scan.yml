# This file is kept here so the book can reference its path (ch04-iac-ai-era/
# .github/workflows/iac-scan.yml) and show readers how a chapter-scoped workflow
# would be structured. The canonical, running version is the root ci.yml.
#
# If this repo is ever split so ch04 lives in its own repository, promote this
# file to that repo's root .github/workflows/ and restore the trigger and jobs
# below.
