# Listing 10-3: a DVC pipeline whose stages re-run only when their inputs change.
stages:
  prepare:
    cmd: python prepare.py
    deps:
      - prepare.py
    outs:
      - features.parquet
  train:
    cmd: python train.py
    deps:
      - train.py
      - features.parquet
    outs:
      - metrics.json
