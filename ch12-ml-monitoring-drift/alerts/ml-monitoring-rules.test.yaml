# Unit tests for ml-monitoring-rules.yaml, run in CI with `promtool test rules`.
# The input series carry the exact label set the labs export
# (model="anomaly-detector"), so a selector/label mismatch between the exporter
# and a rule makes the firing test fail. `promtool check rules` alone cannot
# catch that: a rule whose selector matches nothing is still syntactically valid.
rule_files:
  - ml-monitoring-rules.yaml

evaluation_interval: 1m

tests:
  # Healthy period: estimated AUC above the 0.90 gate, minority drift.
  # Neither alert may fire.
  - interval: 1m
    input_series:
      - series: 'ml_estimated_roc_auc{model="anomaly-detector"}'
        values: '0.97+0x30'
      - series: 'ml_drift_share{model="anomaly-detector"}'
        values: '0.2+0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: AnomalyDetectorEstimatedAUCLow
        exp_alerts: []
      - eval_time: 30m
        alertname: AnomalyDetectorFeatureDriftHigh
        exp_alerts: []

  # Degraded period: estimated AUC under the gate and every feature drifting,
  # sustained past the 15m hold. Both alerts fire and carry the model label
  # from the series through to the alert.
  - interval: 1m
    input_series:
      - series: 'ml_estimated_roc_auc{model="anomaly-detector"}'
        values: '0.85+0x30'
      - series: 'ml_drift_share{model="anomaly-detector"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: AnomalyDetectorEstimatedAUCLow
        exp_alerts:
          - exp_labels:
              model: anomaly-detector
              severity: warning
              team: aiops
            exp_annotations:
              summary: "anomaly-detector estimated ROC AUC below 0.90"
              description: >
                CBPE estimates ROC AUC at 0.850 for anomaly-detector over the
                last 15m, under the 0.90 retraining gate. No ground-truth
                labels are required for this signal. Check the Evidently drift
                gauges and the ADWIN change log, then backfill labels before
                deciding to retrain.
      - eval_time: 30m
        alertname: AnomalyDetectorFeatureDriftHigh
        exp_alerts:
          - exp_labels:
              model: anomaly-detector
              severity: info
              team: aiops
            exp_annotations:
              summary: "anomaly-detector input drift above 50 percent of features"
              description: >
                Evidently flags 100% of feature columns as drifted for
                anomaly-detector. Multivariate drift usually precedes a
                measurable performance drop; correlate with the estimated ROC
                AUC gauge.
